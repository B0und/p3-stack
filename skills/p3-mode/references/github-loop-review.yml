name: Agent review

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review, closed]
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  review:
    if: >-
      (github.event_name == 'pull_request' && github.event.action != 'closed' && !github.event.pull_request.draft) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      startsWith(github.event.comment.body, '<!-- p3-response head='))
    runs-on: ubuntu-latest
    concurrency:
      group: review-${{ github.event.pull_request.number || github.event.issue.number }}-${{ github.event.pull_request.head.sha || github.event.comment.id }}
    steps:
      - name: Open a reviewer thread
        env:
          URL: ${{ secrets.P3_REVIEW_WEBHOOK }}
          SECRET: ${{ secrets.P3_REVIEW_SECRET }}
          PR: ${{ github.event.pull_request.number || github.event.issue.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          COMMENT: ${{ github.event.comment.id }}
        run: |
          body=$(jq -cn --arg pr "$PR" --arg head "$HEAD" --arg comment "$COMMENT" '{pr: $pr, head: $head, comment: $comment}')
          signature=$(printf '%s' "$body" | openssl dgst -sha256 -hmac "$SECRET" -hex | sed 's/^.* //')
          curl --fail-with-body -sS -X POST -H 'content-type: application/json' -H "x-hub-signature-256: sha256=$signature" --data "$body" "$URL"

  close-labels:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && startsWith(github.event.pull_request.head.ref, 'agent/issue-')
    runs-on: ubuntu-latest
    steps:
      - name: Set the issue's closing labels
        env:
          GH_TOKEN: ${{ github.token }}
          REF: ${{ github.event.pull_request.head.ref }}
          MERGED: ${{ github.event.pull_request.merged }}
        run: |
          issue="${REF#agent/issue-}"
          case "$issue" in ''|*[!0-9]*) exit 0 ;; esac
          if [ "$MERGED" = true ]; then label=agent:done; else label=agent:blocked; fi
          gh issue edit "$issue" --repo "$GITHUB_REPOSITORY" --add-label "$label" --remove-label agent:pr
